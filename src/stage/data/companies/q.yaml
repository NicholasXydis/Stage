- name: Qualcomm
  platform: custom_json
  slug: qualcomm
  source_of_record: discover
  last_verified: 2026-08-16
  notes: '2026-08-16: eightfold /api/pcsx/search?domain= — the endpoint template carries
    across tenants, the filter names do not.'
  custom:
    url: https://careers.qualcomm.com/api/pcsx/search?domain=qualcomm.com&query=&location=&start=0&sort_by=relevance&filter_seniority=Intern
    jobs_path: data.positions
    fields:
      title: name
      id: id
      location: standardizedLocations
      department: department
    url_template: https://careers.qualcomm.com/careers/job/{id}
    page_param: start
    page_size: 10
    max_pages: 20
