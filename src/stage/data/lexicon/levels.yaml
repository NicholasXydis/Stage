# Titles that screen_internship rejects or does not recognise are sorted here into new-grad,
# entry, or not early-career. Order of precedence: blocked phrases are scrubbed, seniority wins,
# then new-grad markers, then entry markers.

seniority:
  - senior
  - sr
  - staff
  - principal
  - lead
  - manager
  - director
  - head of
  - architect
  - vp
  - vice president
  - chief
  - distinguished
  - supervisor
  - mid level
  - intermediate
  - experienced
  - expert
  - gestionnaire
  - directeur
  - directrice
  - responsable
  - superviseur
  - intermediaire

# Phrases that look like early-career markers but name something else. They are removed from the
# title before the markers are read.
blocked:
  - campus recruiter
  - campus recruiters
  - campus recruiting
  - campus talent
  - campus dining
  - campus security
  - campus ambassador
  - graduate assistant
  - graduate research
  - graduate teaching
  - graduate admissions
  - graduate school
  - associate director
  - associate counsel
  - associate attorney
  - associate dean
  - associate professor
  - associate vice president

