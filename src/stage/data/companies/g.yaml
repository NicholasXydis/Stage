- name: Goldman Sachs
  platform: custom_json
  slug: goldmansachs
  source_of_record: discover
  last_verified: 2026-08-19
  notes: Public GraphQL gateway, introspection open; experiences CAMPUS is the publisher's
    own early-careers scope. Detail route /roles/[roleId] read from the app build
    manifest.
  custom:
    url: https://api-higher.gs.com/gateway/api/v1/graphql
    method: POST
    body:
      query: query($i:RoleSearchQueryInput!){roleSearch(searchQueryInput:$i){totalCount
        items{roleId jobTitle division descriptionHtml lastPostedDate locations{city
        state country}}}}
      variables:
        i:
          page:
            pageSize: 250
            pageNumber: 0
          experiences:
          - CAMPUS
    jobs_path: data.roleSearch.items
    fields:
      title: jobTitle
      id: roleId
      location: locations.0.city
      description: descriptionHtml
      department: division
    url_template: https://higher.gs.com/roles/{id}
    page_param: variables.i.page.pageNumber
    page_size: 250
    page_step: 1
    max_pages: 6
