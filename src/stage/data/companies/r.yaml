- name: Retool
  platform: custom_json
  slug: retool
  source_of_record: discover
  last_verified: 2026-08-21
  notes: '2026-08-21: the official Gem board used by Retool exposes a public GraphQL
    listing query; the existing POST adapter returned 34 postings with direct job
    URLs.'
  custom:
    url: https://jobs.gem.com/api/public/graphql
    method: POST
    body:
      query: "query JobBoardList($boardId: String!) {\n  oatsExternalJobPostings(boardId:\
        \ $boardId) {\n    jobPostings {\n      id\n      extId\n      title\n   \
        \   locations {\n        id\n        name\n        city\n        isoCountry\n\
        \        isRemote\n        extId\n      }\n      job {\n        id\n     \
        \   department {\n          id\n          name\n          extId\n        }\n\
        \        locationType\n        employmentType\n      }\n    }\n  }\n}\n"
      variables:
        boardId: retool
    headers:
      Origin: https://jobs.gem.com
      Referer: https://jobs.gem.com/retool
    jobs_path: data.oatsExternalJobPostings.jobPostings
    fields:
      title: title
      id: extId
      location: locations.0.name
      department: job.department.name
      employment_type: job.employmentType
    url_template: https://jobs.gem.com/retool/{id}
