  notes: 'Sigma-RH board verified 2026-11-02: page one lists the newest 20 offers and page
    two needs an ASP.NET postback, so only page one is read and the row never closes
    postings. Each row carries its offer number in openOffer(N).'
  custom:
    url: https://optimumfinancier.sigma-rh.net/optimumfinancier/Modules/General/Recruitment/ViewJobPostingsBoard.aspx?e=optimum&b=1&br=1&l=1
    format: html
    authoritative: false
    url_template: https://optimumfinancier.sigma-rh.net/optimumfinancier/Modules/General/Recruitment/ViewJobPostingDetails.aspx?jo={id}&fjb=1&e=optimum&b=1&br=1&l=1
    row_selector: div.srhJbOffer
    fields:
      title: .srhJbTitle span
      id: a.sigmaThemeButton::number(onclick)
      location: div:nth-of-type(2) span + span
      department: div:nth-of-type(3) span + span
      category: div:nth-of-type(4) span + span
