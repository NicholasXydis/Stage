- name: John Deere
  platform: custom_json
  slug: john-deere
  source_of_record: discover
  last_verified: 2026-08-17
  notes: Eightfold tenant reached through the shared /api/pcsx/search template.
  custom:
    url: https://careers.deere.com/api/pcsx/search?domain=johndeere.com&query=&location=&start=0&sort_by=hot&filter_seniority=0
    jobs_path: data.positions
    fields:
      title: name
      id: id
      location: locations
      category: department
    url_template: https://careers.deere.com/careers/job/{id}
    page_param: start
    page_size: 10
    max_pages: 20
- name: Johns Hopkins APL
  platform: custom_json
  slug: jhuapl
  source_of_record: discover
  last_verified: 2026-08-20
  notes: '2026-08-20: iCIMS careers-home site, the same contract as the AMD row; 356
    postings with full bodies.'
  custom:
    url: https://careers.jhuapl.edu/api/jobs?limit=100
    jobs_path: jobs
    fields:
      title: data.title
      id: data.slug
      location: data.full_location
      description: data.description
      employment_type: data.employment_type
      category: data.category
      department: data.department
    url_template: https://careers.jhuapl.edu/jobs/{id}
    page_param: page
    page_size: 100
    page_start: 1
    page_step: 1
    max_pages: 8
