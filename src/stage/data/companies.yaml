  platform: custom_json
  slug: dayforce-ibgllc
  source_of_record: discover
  last_verified: 2026-08-18
  notes: Dayforce, reached by sending the /api/auth/csrf token as x-csrf-token; no
    stable per-posting URL exists so apply_url is the board page.
  custom:
    url: https://jobs.dayforcehcm.com/api/geo/ibgllc/jobposting/search
    method: POST
    body:
      clientNamespace: ibgllc
      jobBoardCode: CANDIDATEPORTAL
      cultureCode: en-CA
      distanceUnit: 1
    handshake_url: https://jobs.dayforcehcm.com/api/auth/csrf
    token_pattern: '"csrfToken":"([a-f0-9]+)"'
    token_header: x-csrf-token
    jobs_path: jobPostings
    fields:
      title: jobTitle
      id: jobPostingId
      description: jobDescription
      location: postingLocations.0.formattedAddress
    url_template: https://jobs.dayforcehcm.com/en-CA/ibgllc/CANDIDATEPORTAL
    page_param: paginationStart
    page_size: 25
    page_step: 25
    max_pages: 20
