- name: Green Shield Canada
  platform: custom_json
  slug: greenshield
  source_of_record: manual
  last_verified: 2026-11-01
  notes: 'Cornerstone search from greenshield.ca verified 2026-11-01 through uk.api.csod.com
    with the career page token: 77 postings, 4 co-op students, 1 kept as CS.'
  custom:
    url: https://uk.api.csod.com/rec-job-search/external/jobs
    method: POST
    body:
      careerSiteId: 4
      careerSitePageId: 4
      pageNumber: 1
      pageSize: 25
      cultureId: 1
      cultureName: en-US
      searchText: ''
      states: []
      countryCodes: []
      cities: []
      placeID: ''
      radius: null
      postingsWithinDays: null
      customFieldCheckboxKeys: []
      customFieldDropdowns: []
      customFieldRadios: []
    handshake_url: https://greenshield.csod.com/ux/ats/careersite/4/home?c=greenshield&lang=en-US
    token_pattern: '"token":"([A-Za-z0-9._-]+)"'
    token_header: Authorization
    token_prefix: 'Bearer '
    jobs_path: data.requisitions
    fields:
      title: displayJobTitle
      id: requisitionId
      location: locations
      description: externalDescription
    url_template: https://greenshield.csod.com/ux/ats/careersite/4/home/requisition/{id}?c=greenshield
    page_param: pageNumber
    page_size: 25
    page_start: 1
    page_step: 1
    max_pages: 8
