- name: Firefly Aerospace
  platform: custom_json
  slug: fireflyspace
  source_of_record: discover
  last_verified: 2026-08-20
  notes: '2026-08-20: owner-captured ClearCompany request. The board id is the path,
    the visible site renders from it client-side, and location already carries the
    uppercase subdivision code.'
  custom:
    url: https://careers-api.clearcompany.com/v1/00ed92c3-5bfb-7bfb-456d-4d9d77fef9a5?pageSize=25&source=CJB-0
    headers:
      Origin: https://fireflyspace.com
      Referer: https://fireflyspace.com/
    jobs_path: results
    fields:
      title: positionTitle
      id: id
      url: applyLink
      location: location
      description: description
      department: departmentName
    page_param: pageIndex
    page_size: 25
    page_step: 1
    max_pages: 20
