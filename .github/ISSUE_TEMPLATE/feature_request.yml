name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task you are trying to accomplish, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: What you would like to see, if you have something specific in mind.
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How you handle this today, if at all.
    validations:
      required: false
