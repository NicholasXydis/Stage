- name: WestJet
  platform: custom_json
  slug: dayforce-westjet
  source_of_record: manual
  last_verified: 2026-11-02
  rate_profile: conservative
  notes: Calgary airline whose careers page links this Dayforce board, read with the
    csrf handshake like Eidos-Montreal. A scratch sync on 2026-11-02 read 30 postings,
    4 of them data, AI and database roles in Calgary, and kept no CS internship.
  custom:
    url: https://jobs.dayforcehcm.com/api/geo/WestJet/jobposting/search
    method: POST
    body:
      clientNamespace: WestJet
      jobBoardCode: CANDIDATEPORTAL
      cultureCode: en-CA
      distanceUnit: 1
    handshake_url: https://jobs.dayforcehcm.com/api/auth/csrf
    token_pattern: '"csrfToken":"([a-f0-9]+)"'
    token_header: x-csrf-token
    jobs_path: jobPostings
    fields:
      title: jobTitle
      id: jobPostingId
      description: jobDescription
      location: postingLocations.0.formattedAddress
    url_template: https://jobs.dayforcehcm.com/en-CA/WestJet/CANDIDATEPORTAL/jobs/{id}
    page_param: paginationStart
    page_size: 25
    page_step: 25
    max_pages: 20
