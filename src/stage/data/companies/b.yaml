- name: Bank of America
  platform: custom_json
  slug: bankofamerica
  source_of_record: discover
  last_verified: 2026-08-30
  notes: '2026-08-30: tal.net now answers every request with an Altcha proof-of-work
    page titled "Quick Check Needed", so the old html board cannot be read and a fresh
    xf- token does not help. careers.bankofamerica.com serves the same campus listings
    as json from campusjobssearchservlet, which needs no token and returns all 74
    rows in one request. The experienced-hire sibling, jobssearchservlet, carries
    2,273 rows and no internships, so it is deliberately not used.'
  custom:
    url: https://careers.bankofamerica.com/services/campusjobssearchservlet?start=0&rows=200&search=getAllJobs
    jobs_path: jobsList
    fields:
      title: postingTitle
      id: jobRequisitionId
      location: location
      description: jobDescriptionExternal
      category: family
    url_template: https://careers.bankofamerica.com/en-us/students/job-detail/{id}/job
