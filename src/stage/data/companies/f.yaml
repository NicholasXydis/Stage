      title: data.title
      id: data.req_id
      location: data.full_location
      description: data.description
      category: data.categories
      employment_type: data.employment_type
    url_template: https://firstcitizens.jibeapply.com/jobs/{id}
    page_param: page
    page_size: 100
    page_start: 1
    page_step: 1
    max_pages: 3
