name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
      placeholder: |
        I ran `stage list --role swe` and expected ...
        Instead ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `stage --version`.
      placeholder: stage 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board or company
      description: If this involves one employer, the careers or board URL.
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant output, with local paths removed.
      render: text
    validations:
      required: false
