- name: National Bank of Canada
  platform: custom_json
  slug: bnc
  source_of_record: discover
  last_verified: 2026-11-02
  notes: 'Every Avature JSON shape returns markup, so the server-rendered results table
    is read instead. 2026-11-02: a scratch sync read all 408 postings in 21 pages, and
    its 4 internships were finance and audit roles. Some student postings are listed only
    on the students page, which the bnc-students row reads.'
  custom:
    url: https://emplois.bnc.ca/en_CA/careers/searchjobs/
    format: html
    row_selector: table tr:has(a[data-map='job-detail-link'])
    fields:
      title: a[data-map='job-detail-link']
      id: a[data-map='job-detail-link']::attr(href)
      url: a[data-map='job-detail-link']::attr(href)
      location: td:nth-of-type(1)
    page_param: jobOffset
    page_size: 20
    page_step: 20
    max_pages: 25
- name: National Bank of Canada
  platform: custom_json
  slug: bnc-students
  source_of_record: manual
  last_verified: 2026-11-02
  notes: '2026-11-02: the Avature students page lists internships and student jobs, some
    of them missing from the all-jobs search the bnc row reads (Intern Corporate Account
    Manager in Levis). A scratch sync read 4 postings, all finance or account management,
    and kept none.'
  custom:
    url: https://emplois.bnc.ca/en_CA/careers/studentsandintershipjoboffers
    format: html
    row_selector: table tr:has(a[data-map='job-detail-link'])
    fields:
      title: a[data-map='job-detail-link']
      id: a[data-map='job-detail-link']::attr(href)
      url: a[data-map='job-detail-link']::attr(href)
      location: td:nth-of-type(1)
    page_param: jobOffset
    page_size: 20
    page_step: 20
    max_pages: 5
