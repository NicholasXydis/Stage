- name: BAE Systems
  platform: custom_json
  slug: baesystems
  source_of_record: discover
  last_verified: 2026-08-20
  notes: '2026-08-20: WordPress career site; the public wp/v2 jobs post type is the
    listing contract. Its location taxonomy is not the first embedded group, so the
    path names it rather than counting.'
  custom:
    url: https://jobsearch.baesystems.com/wp-json/wp/v2/jobs?per_page=100&_embed=wp%3Aterm
    fields:
      title: title.rendered
      id: id
      url: link
      location: _embedded.wp:term[0.taxonomy=location].0.name
      department: _embedded.wp:term[0.taxonomy=area-of-work].0.name
    page_param: page
    page_size: 100
    page_start: 1
    page_step: 1
    max_pages: 8
