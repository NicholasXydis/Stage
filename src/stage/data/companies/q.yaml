- name: Questrade
  platform: custom_json
  slug: dayforce-qfg
  source_of_record: manual
  last_verified: 2026-11-02
  rate_profile: conservative
  notes: Toronto fintech whose careers page links this Dayforce board, read with the
    csrf handshake like Eidos-Montreal. A scratch sync on 2026-11-02 read 81 postings,
    35 of them software, data or QA roles in Toronto and Calgary, and kept no CS internship.
  custom:
    url: https://jobs.dayforcehcm.com/api/geo/qfg/jobposting/search
    method: POST
    body:
      clientNamespace: qfg
      jobBoardCode: CANDIDATEPORTAL
      cultureCode: en-CA
      distanceUnit: 1
    handshake_url: https://jobs.dayforcehcm.com/api/auth/csrf
    token_pattern: '"csrfToken":"([a-f0-9]+)"'
    token_header: x-csrf-token
    jobs_path: jobPostings
    fields:
      title: jobTitle
      id: jobPostingId
      description: jobDescription
      location: postingLocations.0.formattedAddress
    url_template: https://jobs.dayforcehcm.com/en-CA/qfg/CANDIDATEPORTAL/jobs/{id}
    page_param: paginationStart
    page_size: 25
    page_step: 25
    max_pages: 20
