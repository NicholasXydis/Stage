- name: Manitoba Blue Cross
  platform: custom_json
  slug: dayforce-bluerewards
  source_of_record: manual
  last_verified: 2026-11-01
  rate_profile: conservative
  notes: 'Dayforce board bluerewards linked from mb.bluecross.ca verified 2026-11-01: 6 postings,
    no internship.'
  custom:
    url: https://jobs.dayforcehcm.com/api/geo/bluerewards/jobposting/search
    method: POST
    body:
      clientNamespace: bluerewards
      jobBoardCode: CANDIDATEPORTAL
      cultureCode: en-US
      distanceUnit: 1
    handshake_url: https://jobs.dayforcehcm.com/api/auth/csrf
    token_pattern: '"csrfToken":"([a-f0-9]+)"'
    token_header: x-csrf-token
    jobs_path: jobPostings
    fields:
      title: jobTitle
      id: jobPostingId
      description: jobDescription
      location: postingLocations.0.formattedAddress
    url_template: https://jobs.dayforcehcm.com/en-US/bluerewards/CANDIDATEPORTAL/jobs/{id}
    page_param: paginationStart
    page_size: 25
    page_step: 25
    max_pages: 8
