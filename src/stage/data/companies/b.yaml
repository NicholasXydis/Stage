  source_of_record: manual
  last_verified: 2026-11-02
  notes: BRP's own careers site careers.brp.com is a Phenom site, read through its
    public widgets search like Air Canada. A scratch sync on 2026-11-02 read 291 postings,
    41 of them software, data or security roles in Valcourt, Sherbrooke and Montreal,
    and kept no CS internship, though it lists a Winter 2027 internship program in
    Valcourt.
  custom:
    url: https://careers.brp.com/widgets
    method: POST
    body:
      lang: en_global
      deviceType: desktop
      country: global
      pageName: search-results
      ddoKey: refineSearch
      from: 0
      size: 100
      jobs: true
      counts: true
      all_fields:
      - category
      - country
      - type
      keywords: ''
      siteType: external
      clearAll: false
      selected_fields: {}
      locationData: {}
      sortBy: ''
      subsearch: ''
    jobs_path: refineSearch.data.jobs
    fields:
      title: title
      id: jobId
      location: location
      description: descriptionTeaser
      category: category
      department: department
    url_template: https://careers.brp.com/global/en/job/{id}
    page_param: from
    page_size: 100
    max_pages: 3
