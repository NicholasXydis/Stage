- name: Activision (Phenom)
  platform: custom_json
  slug: activision-phenom
  source_of_record: discover
  last_verified: &id017 2026-08-18
  notes: Phenom POST /widgets, fetched unfiltered because keywords=intern drops French
    Montreal titles.
  custom:
    url: https://careers.activision.com/widgets
    method: POST
    body:
      lang: en_us
      deviceType: desktop
      country: us
      pageName: search-results
      ddoKey: refineSearch
      from: 0
      size: 10
      jobs: true
      counts: true
      all_fields:
      - category
      - country
      - type
      keywords: ''
      siteType: external
      clearAll: false
      selected_fields: {}
      locationData: {}
      sortBy: ''
      subsearch: ''
    jobs_path: refineSearch.data.jobs
    fields:
      title: title
      id: jobSeqNo
      location: location
      url: applyUrl
      description: descriptionTeaser
      category: category
      department: department
    page_param: from
    page_size: 10
    max_pages: 8
