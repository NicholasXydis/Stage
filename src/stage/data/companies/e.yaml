- name: Eclipse Automation
  platform: custom_json
  slug: dayforce-eclipse
  source_of_record: manual
  last_verified: 2026-11-02
  rate_profile: conservative
  notes: Eclipse Automation posts its co-ops on this Dayforce board, which its own
    apply links in the community feeds point to. The greenhouse/eclipse row carries
    a different employer. A scratch sync on 2026-11-02 read 71 postings in Cambridge,
    Ontario, 16 of them software or controls roles, and kept 3 CS co-ops.
  custom:
    url: https://jobs.dayforcehcm.com/api/geo/eclipse/jobposting/search
    method: POST
    body:
      clientNamespace: eclipse
      jobBoardCode: CANDIDATEPORTAL
      cultureCode: en-CA
      distanceUnit: 1
    handshake_url: https://jobs.dayforcehcm.com/api/auth/csrf
    token_pattern: '"csrfToken":"([a-f0-9]+)"'
    token_header: x-csrf-token
    jobs_path: jobPostings
    fields:
      title: jobTitle
      id: jobPostingId
      description: jobDescription
      location: postingLocations.0.formattedAddress
    url_template: https://jobs.dayforcehcm.com/en-CA/eclipse/CANDIDATEPORTAL/jobs/{id}
    page_param: paginationStart
    page_size: 25
    page_step: 25
    max_pages: 20
