- name: OMERS
  platform: custom_json
  slug: omers
  source_of_record: discover
  last_verified: 2026-08-20
  notes: Phenom POST /widgets, fetched unfiltered because its Students & Interns category
    holds only three of 79 postings.
  custom:
    url: https://careers.omers.com/widgets
    method: POST
    body:
      lang: en_global
      deviceType: desktop
      country: ca
      pageName: search-results
      ddoKey: refineSearch
      from: 0
      size: 100
      jobs: true
      counts: true
      all_fields:
      - category
      - country
      - type
      keywords: ''
      siteType: external
      clearAll: false
      selected_fields: {}
      locationData: {}
      sortBy: ''
      subsearch: ''
    jobs_path: refineSearch.data.jobs
    fields:
      title: title
      id: jobSeqNo
      location: location
      url: applyUrl
      description: descriptionTeaser
      category: category
      department: department
    page_param: from
    page_size: 100
    max_pages: 6
