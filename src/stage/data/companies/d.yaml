    than its whole global board.
  custom:
    url: https://www.disneycareers.com/en/search-jobs/internship/391/1
    format: html
    row_selector: '#search-results-list li'
    fields:
      title: h2
      id: a::attr(data-job-id)
      url: a::attr(href)
      location: .job-location
      category: .job-category
    page_param: p
    page_size: 1
    page_start: 1
    page_step: 1
    max_pages: 12
