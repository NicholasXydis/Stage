[project]
name = "stage-cli"
version = "0.1.0"
description = "Aggregates CS internship postings (Canada/US, EN + FR) into a local SQLite database"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "fpdf2>=2.8.4",
    "httpx>=0.28.1",
    "platformdirs>=4.3.6",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
]

[project.scripts]
stage = "stage.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.4",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "PTH",
    "RET",
    "SIM",
    "TID",
    "ARG",
    "S",
]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "S105", "S106", "S603", "SLF001"]
"src/stage/storage/sqlite_repo.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/stage"]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
