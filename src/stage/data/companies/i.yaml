- name: IDEXX (Phenom)
  platform: custom_json
  slug: idexx-phenom
  source_of_record: discover
  last_verified: 2026-08-18
  notes: '2026-08-18: supplied by the owner. The Workday row for this employer is
    parked; the live board is Phenom.'
  custom:
    url: https://careers.idexx.com/widgets
    method: POST
    body:
      lang: en_us
      deviceType: desktop
      country: us
      pageName: search-results
      ddoKey: refineSearch
      from: 0
      size: 10
      jobs: true
      counts: true
      all_fields:
      - category
      - country
      - type
      keywords: intern
      siteType: external
      clearAll: false
      selected_fields: {}
      locationData: {}
      sortBy: ''
      subsearch: ''
    jobs_path: refineSearch.data.jobs
    fields:
      title: title
      id: jobSeqNo
      location: location
      url: applyUrl
      description: descriptionTeaser
      category: category
      department: department
    page_param: from
    page_size: 10
    max_pages: 4
