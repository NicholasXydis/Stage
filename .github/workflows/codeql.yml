name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            label: Python
          - language: actions
            label: Actions

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - name: Analyze ${{ matrix.label }}
        id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with:
          category: /language:${{ matrix.language }}
      - name: Write summary
        if: always()
        run: |
          codeql="FAIL"
          if [ "${{ steps.analyze.outcome }}" = "success" ]; then codeql="PASS"; fi
          {
            echo "## Security analysis"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| CodeQL ${{ matrix.label }} | $codeql |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if analysis is not healthy
        if: always()
        run: |
          if [ "${{ steps.analyze.outcome }}" != "success" ]; then exit 1; fi
