- name: D. E. Shaw
  platform: custom_json
  slug: deshaw
  source_of_record: discover
  last_verified: 2026-08-17
  notes: Server-rendered with no job JSON anywhere, but the page embeds __NEXT_DATA__
    with a props.pageProps.internships array, read through extract.
  custom:
    url: https://www.deshaw.com/careers/internships
    extract: __NEXT_DATA__
    jobs_path: props.pageProps.internships
    fields:
      title: data.displayName
      id: data.id
      location: office.0.name
      description: data.jobDescription.websiteDescription
      category: data.department.name
    url_template: https://www.deshaw.com/careers/{id}
