- name: CN
  platform: custom_json
  slug: cn
  source_of_record: discover
  last_verified: 2026-08-19
  notes: Cornerstone; the career page hands every visitor a JWT, and careerSiteId
    1 is the union of its sites 3, 4 and 5.
  custom:
    url: https://us.api.csod.com/rec-job-search/external/jobs
    method: POST
    body:
      careerSiteId: 1
      careerSitePageId: 1
      pageNumber: 1
      pageSize: 25
      cultureId: 1
      cultureName: en-US
      searchText: ''
      states: []
      countryCodes: []
      cities: []
      placeID: ''
      radius: null
      postingsWithinDays: null
      customFieldCheckboxKeys: []
      customFieldDropdowns: []
      customFieldRadios: []
    handshake_url: https://cn360.csod.com/ux/ats/careersite/6/home?c=cn360&lang=en-US
    token_pattern: '"token":"([A-Za-z0-9._-]+)"'
    token_header: Authorization
    token_prefix: 'Bearer '
    jobs_path: data.requisitions
    fields:
      title: displayJobTitle
      id: requisitionId
      location: locations
      description: externalDescription
    url_template: https://cn360.csod.com/ux/ats/careersite/6/home/requisition/{id}?c=cn360
    page_param: pageNumber
    page_size: 25
    page_start: 1
    page_step: 1
    max_pages: 8
