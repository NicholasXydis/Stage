name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: uv run ruff check src/ tests/
      - name: Mypy strict
        id: mypy
        continue-on-error: true
        run: uv run mypy
      - name: Tests
        id: pytest
        continue-on-error: true
        run: uv run pytest -q
      - name: Lint workflows
        id: actionlint
        continue-on-error: true
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Write summary
        if: always()
        run: |
          result() { [ "$1" = "success" ] && echo "PASS" || echo "FAIL"; }
          {
            echo "## CI"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Ruff | $(result "${{ steps.ruff.outcome }}") |"
            echo "| Mypy strict (src + tests) | $(result "${{ steps.mypy.outcome }}") |"
            echo "| Tests | $(result "${{ steps.pytest.outcome }}") |"
            echo "| Workflow lint | $(result "${{ steps.actionlint.outcome }}") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any check failed
        if: always()
        run: |
          for outcome in \
            "${{ steps.ruff.outcome }}" \
            "${{ steps.mypy.outcome }}" \
            "${{ steps.pytest.outcome }}" \
            "${{ steps.actionlint.outcome }}"; do
            if [ "$outcome" != "success" ]; then exit 1; fi
          done

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
