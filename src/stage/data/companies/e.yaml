- name: Eidos-Montreal
  platform: custom_json
  slug: dayforce-eic
  source_of_record: discover
  last_verified: 2026-08-18
  rate_profile: conservative
  notes: 'Dayforce, reached by sending the /api/auth/csrf token as x-csrf-token. 2026-08-21:
    two boards on this host answered 403 in one run, so the row is pinned conservative.'
  custom:
    url: https://jobs.dayforcehcm.com/api/geo/eic/jobposting/search
    method: POST
    body:
      clientNamespace: eic
      jobBoardCode: CANDIDATEPORTAL
      cultureCode: en-CA
      distanceUnit: 1
    handshake_url: https://jobs.dayforcehcm.com/api/auth/csrf
    token_pattern: '"csrfToken":"([a-f0-9]+)"'
    token_header: x-csrf-token
    jobs_path: jobPostings
    fields:
      title: jobTitle
      id: jobPostingId
      description: jobDescription
      location: postingLocations.0.formattedAddress
    url_template: https://jobs.dayforcehcm.com/en-CA/eic/CANDIDATEPORTAL/jobs/{id}
    page_param: paginationStart
    page_size: 25
    page_step: 25
    max_pages: 20
