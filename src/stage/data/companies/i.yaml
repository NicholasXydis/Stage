- name: IBM
  platform: custom_json
  slug: ibm
  source_of_record: discover
  last_verified: 2026-08-20
  notes: '2026-08-20: owner-captured search request; field_keyword_18 is IBM''s own
    Internship facet and the aggregations were dropped because they only feed the
    facet sidebar.'
  custom:
    url: https://www-api.ibm.com/search/api/v2
    method: POST
    body:
      appId: careers
      scopes:
      - careers2
      query:
        bool:
          must: []
      post_filter:
        term:
          field_keyword_18: Internship
      size: 30
      sort:
      - _score: desc
      - pageviews: desc
      lang: zz
      localeSelector: {}
      sm:
        query: ''
        lang: zz
      _source:
      - _id
      - title
      - url
      - description
      - language
      - field_keyword_05
      - field_keyword_08
      - field_keyword_18
      - field_keyword_19
    headers:
      Origin: https://www.ibm.com
      Referer: https://www.ibm.com/
    jobs_path: hits.hits
    fields:
      title: _source.title
      id: _id
      url: _source.url
      description: _source.description
      location: _source.field_keyword_19
      category: _source.field_keyword_08
      employment_type: _source.field_keyword_18
    page_param: from
    page_size: 30
    page_step: 30
    max_pages: 12
