name: App canary

on:
  schedule:
    - cron: "0 15 * * 2"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-canary.yml
      - scripts/app_canary.py
      - src/stage/domain/ai_apps.py
      - src/stage/services/ai_catalogue.py
      - src/stage/services/app_config.py
      - src/stage/services/connect.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  connect:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen
      - name: Connect Stage to the latest release of every command-line AI app
        id: connect
        continue-on-error: true
        run: |
          uv run python scripts/app_canary.py | tee "$RUNNER_TEMP/apps.txt"
          exit "${PIPESTATUS[0]}"
      - name: Write summary
        if: always()
        run: |
          {
            echo "## App canary on $RUNNER_OS"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/apps.txt" 2>/dev/null || echo "the check produced no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue when an app stopped reading Stage's entry
        if: steps.connect.outcome != 'success' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "App canary: an AI app no longer reads Stage's entry on ${{ runner.os }}"
        run: |
          gh label create app-canary --color d93f0b --description "An AI app changed how it stores MCP servers" --force
          open=$(gh issue list --label app-canary --state open --json title --jq '[.[] | select(.title == env.TITLE)] | length')
          if [ "$open" != "0" ]; then
            echo "An app canary issue for $RUNNER_OS is already open; not filing a duplicate."
            exit 0
          fi
          {
            echo "The weekly check could not connect Stage to every AI app cleanly on $RUNNER_OS."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/apps.txt" 2>/dev/null || echo "the check produced no output"
            echo '```'
            echo ""
            echo "Run: $RUN_URL"
            echo ""
            echo "An app that installs but no longer lists Stage has moved or reshaped its"
            echo "settings. Update its row in src/stage/services/ai_catalogue.py and the notes."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --label app-canary --title "$TITLE" --body-file "$RUNNER_TEMP/issue.md"
      - name: Fail if an app did not connect
        if: always()
        run: |
          if [ "${{ steps.connect.outcome }}" != "success" ]; then exit 1; fi
