- name: LevelBlue
  platform: custom_json
  slug: dayforce-twh
  source_of_record: discover
  last_verified: 2026-10-20
  rate_profile: conservative
  notes: '2026-10-20: formerly the Cybereason row. greenhouse/cybereason answers 404
    since Cybereason became part of LevelBlue; levelblue.com/company/careers links
    the Dayforce portal under the twh namespace, reached by sending the
    /api/auth/csrf token as x-csrf-token.'
  custom:
    url: https://jobs.dayforcehcm.com/api/geo/twh/jobposting/search
    method: POST
    body:
      clientNamespace: twh
      jobBoardCode: CANDIDATEPORTAL
      cultureCode: en-US
      distanceUnit: 1
    handshake_url: https://jobs.dayforcehcm.com/api/auth/csrf
    token_pattern: '"csrfToken":"([a-f0-9]+)"'
    token_header: x-csrf-token
    jobs_path: jobPostings
    fields:
      title: jobTitle
      id: jobPostingId
      description: jobDescription
      location: postingLocations.0.formattedAddress
    url_template: https://jobs.dayforcehcm.com/en-US/twh/CANDIDATEPORTAL/jobs/{id}
    page_param: paginationStart
    page_size: 25
    page_step: 25
