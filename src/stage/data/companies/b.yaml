- name: BCG
  platform: custom_json
  slug: bcg
  source_of_record: discover
  last_verified: 2026-08-16
  notes: Phenom POST /widgets; the earlier HTML-only verdict came from reading the
    document request rather than the widget.
  custom:
    url: https://careers.bcg.com/widgets
    method: POST
    body:
      lang: en_global
      deviceType: desktop
      country: global
      pageName: search-results
      all_fields:
      - country
      - city
      - category
      - company
      - type
      - jobType
      clearAll: false
      counts: true
      ddoKey: refineSearch
      from: 0
      global: true
      irs: false
      isSliderEnable: false
      jdsource: facets
      jobs: true
      keywords: ''
      locationData: {}
      pageId: page17-ds
      selected_fields:
        jobType:
        - Internship
      siteType: external
      size: 10
      sortBy: ''
      subsearch: ''
    jobs_path: refineSearch.data.jobs
    fields:
      title: title
      id: jobId
      location: location
      url: applyUrl
      description: descriptionTeaser
      category: category
      employment_type: type
    page_param: from
    page_size: 10
    max_pages: 15
