    employer''s own internships-and-co-ops page narrows the board'
  custom:
    url: https://careers.cisco.com/widgets
    method: POST
    body:
      lang: en_global
      deviceType: desktop
      country: global
      pageName: search-results
      ddoKey: refineSearch
      from: 0
      size: 10
      jobs: true
      counts: true
      all_fields:
      - category
      - country
      - type
      keywords: intern
      siteType: external
      clearAll: false
      selected_fields: {}
      locationData: {}
      sortBy: ''
      subsearch: ''
    jobs_path: refineSearch.data.jobs
    fields:
      title: title
      id: jobId
      location: location
      url: applyUrl
      description: descriptionTeaser
      category: category
      employment_type: type
    page_param: from
    page_size: 10
    max_pages: 20
