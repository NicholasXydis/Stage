name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COVERAGE_FLOOR: "87"
  UV_VERSION: "0.11.28"
  PLAYWRIGHT_VERSION: "1.64.0"
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Restore the uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-3.12-
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen
      - name: Ruff
        id: ruff
        run: uv run ruff check src/ tests/ scripts/
      - name: Ruff format
        id: ruff_format
        if: always()
        run: uv run ruff format --check src/ tests/ scripts/
      - name: Mypy strict
        id: mypy
        if: always()
        run: |
          uv run mypy
          uv run mypy --platform win32
          uv run mypy --platform darwin
      - name: Tests in parallel with branch coverage
        id: pytest
        if: always()
        run: |
          uv run pytest -q -n auto --cov --cov-branch --cov-report= | tee pytest.txt
          exit "${PIPESTATUS[0]}"
      - name: Wall-clock tests, serial, and the coverage floor
        id: pytest_serial
        if: always()
        run: |
          uv run pytest -q -m serial --cov --cov-append --cov-branch \
            --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered \
            --cov-fail-under="$COVERAGE_FLOOR" | tee pytest-serial.txt
          exit "${PIPESTATUS[0]}"
      - name: The README badges must match this run
        run: |
          uv run python scripts/update_badges.py pytest.txt pytest-serial.txt
          if ! git diff --quiet -- README.md assets/ci-flow.svg; then
            echo "badges are stale; run scripts/update_badges.py and commit" >&2
            git --no-pager diff -- README.md assets/ci-flow.svg
            exit 1
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
      - name: Audit locked dependencies
        id: pip_audit
        if: always()
        run: |
          uv export --frozen --format requirements.txt \
            --no-emit-project --all-groups --no-annotate --no-header \
            -o "$RUNNER_TEMP/requirements.txt" > /dev/null
          uvx pip-audit@2.10.1 --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: Lint workflows
        id: actionlint
        if: always()
        run: |
          curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Write summary
        if: always()
        run: |
          result() { [ "$1" = "success" ] && echo "PASS" || echo "FAIL"; }
          {
            echo "## CI"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Ruff | $(result "${{ steps.ruff.outcome }}") |"
            echo "| Ruff format | $(result "${{ steps.ruff_format.outcome }}") |"
            echo "| Mypy strict (src + tests) | $(result "${{ steps.mypy.outcome }}") |"
            echo "| Tests (parallel) | $(result "${{ steps.pytest.outcome }}") |"
            echo "| Wall-clock tests, coverage >= ${COVERAGE_FLOOR}% | $(result "${{ steps.pytest_serial.outcome }}") |"
            echo "| Dependency audit | $(result "${{ steps.pip_audit.outcome }}") |"
            echo "| Workflow lint | $(result "${{ steps.actionlint.outcome }}") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trim the cache before it is saved
        if: always()
        run: uv cache prune --ci

  supported-pythons:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Restore the uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-${{ matrix.python }}-
      - name: Install the test group only
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --python ${{ matrix.python }} --no-group dev --group test
      - name: Tests in parallel
        run: uv run --no-sync --python ${{ matrix.python }} pytest -q -n auto
      - name: Wall-clock tests, serial
        run: uv run --no-sync --python ${{ matrix.python }} pytest -q -m serial
      - name: Trim the cache before it is saved
        run: uv cache prune --ci

  other-systems:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Restore the uv cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-3.12-
      - name: Install the test group only
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen --python 3.12 --no-group dev --group test
      - name: Tests in parallel
        run: uv run --no-sync --python 3.12 pytest -q -n auto
      - name: Wall-clock tests, serial
        run: uv run --no-sync --python 3.12 pytest -q -m serial
      - name: Trim the cache before it is saved
        run: uv cache prune --ci

  card:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Restore the uv cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-3.12-
      - name: Install locked dependencies and Chromium
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --frozen
          uv run --no-sync --with "playwright==$PLAYWRIGHT_VERSION" \
            playwright install --with-deps chromium
      - name: Render the posting card against a real stage mcp
        run: |
          uv run --no-sync --with "playwright==$PLAYWRIGHT_VERSION" \
            python scripts/card_check.py --shots card-shots
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: card-shots
          path: card-shots
          if-no-files-found: ignore

  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install uv==0.11.28
          uv build --wheel -o dist
      - name: Install it outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m venv smoke
          if [ -d smoke/Scripts ]; then bin=smoke/Scripts; else bin=smoke/bin; fi
          echo "SMOKE_BIN=$RUNNER_TEMP/$bin" >> "$GITHUB_ENV"
          "$bin/python" -m pip install --quiet "$GITHUB_WORKSPACE"/dist/*.whl
      - name: Packaged data must resolve inside the package
        run: |
          cd "$RUNNER_TEMP"
          "$SMOKE_BIN/python" - <<'PY'
          from pathlib import Path
          import stage
          from stage.companies import load_companies
          from stage.paths import card_path, font_path, lexicon_dir, registry_path
          package = Path(stage.__file__).resolve().parent
          for path in (registry_path(), lexicon_dir(), font_path(), card_path()):
              assert path.exists(), f"{path} is missing from the wheel"
              assert package in path.parents, f"{path} resolves outside {package}"
          rows = load_companies()
          assert len(rows) > 300, f"registry shipped with only {len(rows)} rows"
          print(f"registry {len(rows)} rows, font {font_path().stat().st_size} bytes")
          PY
      - name: Large batches must screen in worker processes from the wheel
        run: |
          cd "$RUNNER_TEMP"
          cat > screen_smoke.py <<'PY'
          import asyncio
          from datetime import UTC, datetime

          from stage.domain import Job
          from stage.services.screening import Screener, normalize_batch

          TITLES = ("Software Engineering Intern", "Senior Staff Engineer", "Marketing Intern")


          async def main() -> None:
              now = datetime.now(UTC)
              jobs = [
                  Job(
                      id=f"greenhouse:smoke:{n}",
                      source="greenhouse",
                      company="Smoke",
                      title_raw=TITLES[n % 3],
                      title_normalized=TITLES[n % 3].lower(),
                      apply_url_raw=f"https://example.com/{n}",
                      description="",
                      location_raw="Montreal, QC",
                      first_seen=now,
                      last_seen=now,
                  )
                  for n in range(1500)
              ]
              screener = Screener()
              try:
                  screened = await screener(jobs)
              finally:
                  screener.close()
              assert not screener.broken, "worker processes could not start"
              assert screened == normalize_batch(jobs), "workers screened differently"
              print(f"{len(screened[0])} kept, {len(screened[1])} rejected in workers")


          if __name__ == "__main__":
              asyncio.run(main())
          PY
          "$SMOKE_BIN/python" screen_smoke.py
      - name: Every read command must run from the installed wheel
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd "$RUNNER_TEMP"
          export STAGE_DB="$RUNNER_TEMP/smoke.db"
          "$SMOKE_BIN/stage" help
          "$SMOKE_BIN/stage" list
          "$SMOKE_BIN/stage" search montreal
          "$SMOKE_BIN/stage" doctor
          "$SMOKE_BIN/stage" coverage
          "$SMOKE_BIN/stage" stats
          "$SMOKE_BIN/stage" sync --dry-run
          for format in csv json md pdf; do
            "$SMOKE_BIN/stage" export --format "$format" --all --force \
              --out "$RUNNER_TEMP/smoke.$format"
            test -s "$RUNNER_TEMP/smoke.$format"
          done
      - name: stage mcp must write nothing but JSON-RPC from the installed wheel
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd "$RUNNER_TEMP"
          cat > mcp_smoke.py <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          stage = Path(sys.executable).with_name("stage.exe" if os.name == "nt" else "stage")
          env = dict(os.environ, STAGE_DB=str(Path(os.environ["RUNNER_TEMP"]) / "smoke.db"))
          calls = [
              ("initialize", {
                  "protocolVersion": "2025-11-25",
                  "capabilities": {"extensions": {"io.modelcontextprotocol/ui": {
                      "mimeTypes": ["text/html;profile=mcp-app"]}}},
                  "clientInfo": {"name": "smoke", "version": "1"},
              }),
              ("notifications/initialized", None),
              ("tools/list", {}),
              ("prompts/list", {}),
              ("resources/list", {}),
              ("resources/read", {"uri": "ui://stage/postings.html"}),
              ("tools/call", {"name": "search_postings", "arguments": {"words": "intern"}}),
              ("tools/call", {"name": "get_postings", "arguments": {"ids": ["nope:1"]}}),
          ]
          replies = []
          with subprocess.Popen(
              [str(stage), "mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              env=env,
          ) as process:
              assert process.stdin is not None and process.stdout is not None
              for number, (method, params) in enumerate(calls, start=1):
                  message = {"jsonrpc": "2.0", "method": method}
                  if params is not None:
                      message["id"] = number
                      message["params"] = params
                  process.stdin.write(json.dumps(message).encode() + b"\n")
                  process.stdin.flush()
                  if params is not None:
                      replies.append(json.loads(process.stdout.readline()))
              process.stdin.close()
              rest = process.stdout.read()
              assert process.wait(timeout=60) == 0, process.returncode
          assert rest == b"", rest[:200]
          assert all(reply.get("jsonrpc") == "2.0" for reply in replies), replies
          assert [reply.get("id") for reply in replies] == [1, 3, 4, 5, 6, 7, 8], replies
          assert all("result" in reply for reply in replies), replies
          tools = replies[1]["result"]["tools"]
          card = [tool["name"] for tool in tools if tool.get("_meta", {}).get("ui", {}).get("resourceUri")]
          assert card == ["search_postings"], card
          [resource] = replies[4]["result"]["contents"]
          assert resource["mimeType"] == "text/html;profile=mcp-app", resource["mimeType"]
          assert resource["text"].startswith("<!doctype html>"), resource["text"][:40]
          print(f"{len(replies)} replies, {len(tools)} tools, card {len(resource['text'])} chars")
          PY
          "$SMOKE_BIN/python" mcp_smoke.py
      - name: stage mcp must read a database on a Windows network share
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd "$RUNNER_TEMP"
          cat > share_smoke.py <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          from stage.storage.sqlite_repo import SqliteRepository

          stage = Path(sys.executable).with_name("stage.exe")
          local = Path(os.environ["RUNNER_TEMP"]).resolve() / "share.db"
          SqliteRepository.connect(local).close()
          unc = "\\\\localhost\\" + local.drive[0] + "$" + str(local)[2:]
          assert Path(unc).exists(), f"{unc} is not reachable"
          calls = [
              ("initialize", {"protocolVersion": "2025-11-25", "capabilities": {}, "clientInfo": {"name": "share", "version": "1"}}),
              ("notifications/initialized", None),
              ("tools/call", {"name": "database_status", "arguments": {}}),
          ]
          replies = []
          with subprocess.Popen(
              [str(stage), "mcp"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              env=dict(os.environ, STAGE_DB=unc),
          ) as process:
              assert process.stdin is not None and process.stdout is not None
              for number, (method, params) in enumerate(calls, start=1):
                  message = {"jsonrpc": "2.0", "method": method}
                  if params is not None:
                      message["id"] = number
                      message["params"] = params
                  process.stdin.write(json.dumps(message).encode() + b"\n")
                  process.stdin.flush()
                  if params is not None:
                      replies.append(json.loads(process.stdout.readline()))
              process.stdin.close()
              assert process.wait(timeout=60) == 0, process.returncode
          status = replies[-1]["result"]
          assert not status.get("isError"), status["content"][0]["text"]
          print(f"read {unc} over MCP: {sorted(status['structuredContent'])[:4]}")
          PY
          "$SMOKE_BIN/python" share_smoke.py
      - name: Connecting AI apps must work from the installed wheel
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cd "$RUNNER_TEMP"
          cat > connect_smoke.py <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          home = Path(os.environ["RUNNER_TEMP"]) / "connect-home"
          roaming = home / "AppData" / "Roaming"
          for folder in (
              home / ".cursor",
              roaming / "Claude",
              home / "Library" / "Application Support" / "Claude",
              home / ".config" / "Claude",
          ):
              folder.mkdir(parents=True, exist_ok=True)
          env = dict(
              os.environ,
              HOME=str(home),
              USERPROFILE=str(home),
              APPDATA=str(roaming),
              LOCALAPPDATA=str(home / "AppData" / "Local"),
              XDG_CONFIG_HOME=str(home / ".config"),
              STAGE_DB=str(Path(os.environ["RUNNER_TEMP"]) / "smoke.db"),
          )
          stage = Path(sys.executable).with_name("stage.exe" if os.name == "nt" else "stage")
          apps = {"cursor", "claude-desktop"}


          def run(*arguments: str, shown: bool = True) -> str:
              done = subprocess.run(
                  [str(stage), *arguments], env=env, capture_output=True, text=True, encoding="utf-8"
              )
              if shown or done.returncode:
                  print(done.stdout + done.stderr)
              assert done.returncode == 0, f"stage {' '.join(arguments)} exited {done.returncode}"
              return done.stdout


          def settings() -> list[dict[str, dict[str, object]]]:
              files = [home / ".cursor" / "mcp.json", *home.rglob("claude_desktop_config.json")]
              assert len(files) == 2, files
              return [json.loads(path.read_text(encoding="utf-8"))["mcpServers"] for path in files]


          def states() -> dict[str, str]:
              report = json.loads(run("doctor", "--json", shown=False))
              return {app["app"]: app["status"] for app in report["ai_apps"]}


          said = run("connect", "cursor", "claude-desktop")
          assert "Self-test: Stage answered" in said, "the self-test did not pass"
          for servers in settings():
              entry = servers["Stage"]
              assert Path(entry["command"]).samefile(stage), entry["command"]
              assert entry["args"] == ["mcp"], entry["args"]
              assert Path(entry["env"]["STAGE_DB"]).samefile(env["STAGE_DB"]), entry["env"]
          assert states() == dict.fromkeys(apps, "connected"), states()
          run("connect", "--status")
          run("disconnect", "cursor", "claude-desktop")
          for servers in settings():
              assert not {"Stage", "stage"} & servers.keys(), servers
          assert not apps & states().keys(), states()
          PY
          "$SMOKE_BIN/python" connect_smoke.py
