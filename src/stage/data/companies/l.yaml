- name: L3Harris
  platform: custom_json
  slug: l3harris
  source_of_record: discover
  last_verified: 2026-11-01
  notes: TalentBrew search for intern (k=intern), 15 per page; the p parameter keeps the keyword, while the /search-jobs/intern path drops it on later pages. 117 postings on 2026-11-01.
  custom:
    url: https://careers.l3harris.com/en/search-jobs?k=intern
    format: html
    row_selector: '#search-results-list li'
    fields:
      title: h2
      id: a::attr(data-job-id)
      url: a::attr(href)
      location: .job-location
      category: .job-category
    page_param: p
    page_size: 15
    page_start: 1
    page_step: 1
    max_pages: 12
