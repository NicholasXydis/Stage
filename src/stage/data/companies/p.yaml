- name: PEAK6
  platform: custom_json
  slug: peak6
  source_of_record: discover
  last_verified: 2026-08-20
  notes: '2026-08-20: owner-captured Ongig request. The group_id index is multi-employer
    — 40 of its 67 rows are Apex Fintech — so it is filtered to the PEAK6 subdivisions;
    the apply url template is the one the site''s own bundle builds. The bearer is
    Ongig''s public widget key, not a Stage credential.'
  custom:
    url: https://text-analyzer.ongig.com/api/external/v2/jobs/search
    method: POST
    body:
      query: ''
      precision: 2
      page:
        size: 100
        current: 1
      filters:
        all:
        - any:
          - live: 1
        - any:
          - group_id: 1767
        - any:
          - subdivision: PEAK6
          - subdivision: PEAK6 Capital Management
      result_fields:
        title:
          raw: {}
        location:
          raw: {}
        req_id:
          raw: {}
        job_type:
          raw: {}
        content:
          raw: {}
        category:
          raw: {}
        url:
          raw: {}
        created_at:
          raw: {}
    headers:
      Authorization: Bearer 1bb83b1b-7481-11df-bbeb-b11bb1cb11b4
      Origin: https://peak6.com
      Referer: https://peak6.com/
    jobs_path: results
    fields:
      title: title.raw
      id: url.raw
      location: location.raw
      description: content.raw
      category: category.raw
      employment_type: job_type.raw
    url_template: https://peak6-prod.ongig.com/jobs/{id}
    page_param: page.current
    page_size: 100
    page_start: 1
    page_step: 1
    max_pages: 10
